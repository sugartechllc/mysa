# Eclipse Mosquitto Configuration for local development / testing
listener 1883 0.0.0.0
allow_anonymous true

# Optional WebSockets listener
listener 9001 0.0.0.0
protocol websockets

# Persistence & Logging
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

